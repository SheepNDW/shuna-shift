name: CI

on:
  push:
    branches: [main]
  # 刻意不限制 base 分支。原本是 `branches: [main]`，於是 base 不是 main 的
  # stacked PR（例如 #39 拆成的三層）整個不觸發 CI —— PR 頁面上只剩 Vercel 的
  # 建置勾勾，看起來像通過了，實際上 lint / typecheck / test 一次都沒跑。
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本讀 package.json 的 packageManager；這裡再寫 `version:` 而兩邊不一致時，
      # action 會直接報錯
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: |
          pnpm run test:unit
          pnpm run test:nuxt

      - name: Build
        run: pnpm run build
